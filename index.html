<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131e24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>SSLJ Recording Checklist</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./checklist.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <main>
    <header>
      <p class="brand"><span aria-hidden="true"></span> SSLJ <small>v1.3</small></p>
      <h1>Recording<br>Checklist</h1>
    </header>
    <section class="progress-card" aria-labelledby="progress-label">
      <h2 id="progress-label">Session progress</h2>
      <p id="progress-text" aria-live="polite"></p>
      <progress id="progress" aria-labelledby="progress-label"></progress>
    </section>
    <p id="offline" role="status" hidden></p>
    <p id="storage" role="alert" hidden></p>
    <noscript>Enable JavaScript to use the checklist.</noscript>
    <div id="phases"></div>
    <footer><button id="clear" type="button" disabled>Clear All Checks</button></footer>
  </main>
  <dialog aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title">Clear all checks?</h2>
      <p>This resets your progress across all six phases.</p>
      <div class="actions">
        <button value="cancel" autofocus>Cancel</button>
        <button value="clear" class="danger">Clear All Checks</button>
      </div>
    </form>
  </dialog>
</body>
</html>
